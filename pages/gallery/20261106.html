							<h4>남산 투어2026</h4>
							NOSLab 이상헌 이동영 (석사과정), 김채원, 윤서영, 주희윤, 김세윤 (학부과정) 학생들과 동국대학교 상록원을 출발하여 남산까지 다녀왔습니다.
							2026년도 봄부터 계획했는데 가을(11월)이 되어서 진행하게 되었습니다.
							일정이 지연되면서 아쉬움이 있었지만, 더 많은 학생들이 NOSLab의 연구원이 되어 함께 등산할 수 있어서 좋았습니다.
							봄과는 다르게 가을의 남산은 오색 빛깔로 물든 단풍들이 낭만적인 공간을 제공하는 것 같습니다.
							다음 여행지는 어디로 가야할까요?
